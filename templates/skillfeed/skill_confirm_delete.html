{% extends 'base.html' %}

{% block title %}Delete Skill - Campus Skill Swap{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h1 style="font-size: 3rem;">⚠️</h1>
                    </div>

                    <h2 class="text-center mb-3">Delete Skill?</h2>

                    <div class="card-text mb-4">
                        <p>Are you sure you want to delete this skill?</p>
                        <p class="fw-bold text-danger mb-0">"{{ skill.title }}"</p>
                        <p class="text-muted-sm">This action cannot be undone.</p>
                    </div>

                    <!-- Delete Form -->
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg">
                                Yes, Delete Skill
                            </button>
                            <a href="{% url 'skill_detail' skill.id %}" class="btn btn-secondary btn-lg">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
